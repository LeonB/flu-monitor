# Adafruit ESP32 Feather V2 (8MB flash, 2MB PSRAM) + Adafruit BMP581 and
# Adafruit MCP9601 (MCP96L01) thermocouple amplifier, both over STEMMA QT.
#
# Board notes:
#   - STEMMA QT I2C bus: SDA = GPIO22, SCL = GPIO20
#   - GPIO2 gates power to the STEMMA QT connector (and NeoPixel); it must be
#     driven HIGH or the sensors are unpowered and won't show up on the bus.
#   - Red onboard LED = GPIO13
#   - Adafruit BMP581 breakout defaults to I2C address 0x47 (0x46 with the SDO jumper cut).
#   - Adafruit MCP9601 breakout defaults to I2C address 0x67, and uses
#     ESPHome's stock 'mcp9600' component (it supports both MCP9600 and
#     MCP9601 device IDs). No patched/local component needed.

# Pulled into a lambda below via ${...} text substitution -- !secret alone
# can't reach inside a lambda's raw C++ source, substitutions can.
substitutions:
  google_sheets_webhook_url: !secret google_sheets_webhook_url
  google_sheets_secret: !secret google_sheets_secret

esphome:
  name: flu-monitor
  friendly_name: Flu Monitor

# Third-party, low-adoption component (see google-sheets-logger/README.md for
# why this is here instead of the stock http_request): runs HTTP requests on
# a separate FreeRTOS task so a slow Google Apps Script response doesn't
# block the whole device's main loop. Pinned to a tag, not `main`, so a
# future upstream change can't silently alter this build.
external_components:
  - source:
      type: git
      url: https://github.com/Vaarlion/esphome-http-request-async.git
      ref: esphome-2026.8
    components: [http_request_async]

esp32:
  board: adafruit_feather_esp32_v2
  flash_size: 8MB
  framework:
    type: esp-idf

psram:
  mode: quad
  speed: 80MHz

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption:
      key: !secret api_encryption_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Flu Monitor Fallback"
    password: !secret ap_password

captive_portal:

# Browser dashboard at http://flu-monitor.local showing live sensor state.
# ota disabled here: the 'ota' section above already provides encrypted
# updates, and web_server's own /update endpoint would be unauthenticated.
web_server:
  version: 2
  ota: false

status_led:
  pin: GPIO13

# Power for the STEMMA QT port. Kept on permanently and hidden from Home Assistant.
switch:
  - platform: gpio
    pin:
      number: GPIO2
      ignore_strapping_warning: true
    id: stemma_qt_power
    name: "STEMMA QT Power"
    restore_mode: ALWAYS_ON
    internal: true
    setup_priority: 1200  # POWER: must be on before the i2c bus (1000) initializes

i2c:
  sda: GPIO22
  scl: GPIO20
  # Bus scan disabled: Adafruit's own engineers confirmed the MCP960x/MCP9601
  # series locks up and stops responding after receiving a full I2C bus scan
  # (github.com/adafruit/Adafruit_Wippersnapper_Arduino/issues/299) -- which
  # is exactly the intermittent-then-dead behavior seen here with scan: true.
  scan: false
  # MCP9600-family silicon has a documented errata, "Intermittent I2C Read
  # Command Clock Stretching Failure", that manifests above ~85kHz as stale
  # duplicate register data rather than a bus error (see
  # rikeshkkpatel.co.uk/diy-reflow-oven/problems-with-the-mcp9600-thermocouple-amplifier).
  # Staying at/below 85kHz keeps a safe margin under that threshold.
  frequency: 85kHz

sensor:
  - platform: bmp581_i2c
    address: 0x47
    update_interval: 30s
    temperature:
      id: bmp581_temperature
      name: "Temperature"
      oversampling: 8x
      iir_filter: 4x
    pressure:
      id: bmp581_pressure
      name: "Pressure"
      oversampling: 16x
      iir_filter: 4x

  - platform: mcp9600
    address: 0x67
    thermocouple_type: K
    update_interval: 30s
    hot_junction:
      id: thermocouple_temperature
      name: "Thermocouple Temperature"
    cold_junction:
      id: thermocouple_cold_junction
      name: "Thermocouple Cold Junction"

  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

  - platform: uptime
    name: "Uptime"

button:
  - platform: restart
    name: "Restart"

# Logs sensor readings to a Google Sheet via a Google Apps Script webhook.
# See google-sheets-logger/README.md for how to set that webhook up; the two
# secrets below come from that setup.
http_request_async:
  id: sheets_http_client
  # Defaults (verify_ssl: true) already pull in ESPHome's common-CA bundle,
  # which covers Google's certificate -- no extra esp32 cert bundle config
  # needed for script.google.com.
  useragent: flu-monitor
  # The default 512B tx buffer isn't enough for Google's long deployment-ID
  # URL plus query string and headers; that showed up as an intermittent
  # "HTTP_CLIENT: Out of buffer" / esp_http_client_open ESP_FAIL.
  buffer_size_tx: 1024
  # Apps Script's redirect chain (exec -> googleusercontent echo -> back to
  # exec) occasionally loops before resolving -- observed taking as long as
  # ~40s in direct curl testing, entirely on Google's end (this is a known
  # Apps Script Web App latency characteristic, not device-specific). Since
  # requests now run off the main loop, a generous timeout costs nothing.
  timeout: 30s
  redirect_limit: 6

interval:
  - interval: 5min
    then:
      # GET, not POST: Apps Script Web Apps always redirect to a
      # script.googleusercontent.com URL that only accepts GET, and the
      # ESP32's HTTP client preserves the original method across that
      # redirect (unlike browsers/curl, which downgrade to GET). A POST
      # here fails with HTTP 405 even though it can look fine when tested
      # from a browser. See google-sheets-logger/README.md.
      - http_request_async.get:
          url: !lambda |-
            return (std::string) "${google_sheets_webhook_url}"
              + "?secret=${google_sheets_secret}"
              + "&temperature=" + str_sprintf("%.1f", id(bmp581_temperature).state)
              + "&pressure=" + str_sprintf("%.0f", id(bmp581_pressure).state)
              + "&thermocouple=" + str_sprintf("%.1f", id(thermocouple_temperature).state)
              + "&cold_junction=" + str_sprintf("%.1f", id(thermocouple_cold_junction).state);
          on_error:
            then:
              - logger.log:
                  format: "Google Sheets post failed (cosmetic -- the row usually still lands; see google-sheets-logger/README.md)"
                  level: WARN
