# Adafruit ESP32 Feather V2 (8MB flash, 2MB PSRAM) + Adafruit BMP581 and
# Adafruit MCP9601 (MCP96L01) thermocouple amplifier, both over STEMMA QT.
#
# Board notes:
#   - STEMMA QT I2C bus: SDA = GPIO22, SCL = GPIO20
#   - GPIO2 gates power to the STEMMA QT connector (and NeoPixel); it must be
#     driven HIGH or the sensors are unpowered and won't show up on the bus.
#   - Red onboard LED = GPIO13
#   - Adafruit BMP581 breakout defaults to I2C address 0x47 (0x46 with the SDO jumper cut).
#   - Adafruit MCP9601 breakout defaults to I2C address 0x67, and uses
#     ESPHome's stock 'mcp9600' component (it supports both MCP9600 and
#     MCP9601 device IDs). No patched/local component needed.

# Pulled into a lambda below via ${...} text substitution -- !secret alone
# can't reach inside a lambda's raw C++ source, substitutions can.
substitutions:
  google_sheets_webhook_url: !secret google_sheets_webhook_url
  google_sheets_secret: !secret google_sheets_secret
  # Logging deadband: the periodic 30s tick only actually posts to Sheets if
  # the thermocouple has moved at least this many degrees C since the last
  # point we logged (button-press events always log regardless). Tune this
  # up as the noise floor/what-counts-as-signal becomes clearer; 5C is a
  # deliberately conservative start during data-gathering, so real
  # transitions aren't blurred out this early.
  thermocouple_deadband_c: "5.0"
  # ...but always log at least this often even if nothing crossed the
  # deadband, so a long quiet period doesn't go completely dark.
  log_heartbeat_min: "15"

esphome:
  name: flu-monitor
  friendly_name: Flu Monitor

# State for the Sheets-logging deadband/heartbeat check below. Doesn't need
# to survive a reboot -- a reboot just means the next tick logs immediately,
# which is fine.
globals:
  - id: last_logged_thermocouple_c
    type: float
    restore_value: false
    initial_value: "-1000.0"  # far outside any real reading, so the first tick after boot always logs
  - id: last_log_millis
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: log_reason
    type: std::string
    restore_value: false
    initial_value: '""'

# Third-party, low-adoption component (see google-sheets-logger/README.md for
# why this is here instead of the stock http_request): runs HTTP requests on
# a separate FreeRTOS task so a slow Google Apps Script response doesn't
# block the whole device's main loop. Pinned to a tag, not `main`, so a
# future upstream change can't silently alter this build.
external_components:
  - source:
      type: git
      url: https://github.com/Vaarlion/esphome-http-request-async.git
      ref: esphome-2026.8
    components: [http_request_async]

esp32:
  board: adafruit_feather_esp32_v2
  flash_size: 8MB
  framework:
    type: esp-idf

psram:
  mode: quad
  speed: 80MHz

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption:
      key: !secret api_encryption_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Flu Monitor Fallback"
    password: !secret ap_password

captive_portal:

# Browser dashboard at http://flu-monitor.local showing live sensor state.
# ota disabled here: the 'ota' section above already provides encrypted
# updates, and web_server's own /update endpoint would be unauthenticated.
web_server:
  version: 2
  ota: false

status_led:
  pin: GPIO13

# Power for the STEMMA QT port. Kept on permanently and hidden from Home Assistant.
switch:
  - platform: gpio
    pin:
      number: GPIO2
      ignore_strapping_warning: true
    id: stemma_qt_power
    name: "STEMMA QT Power"
    restore_mode: ALWAYS_ON
    internal: true
    setup_priority: 1200  # POWER: must be on before the i2c bus (1000) initializes

i2c:
  sda: GPIO22
  scl: GPIO20
  # Bus scan disabled: Adafruit's own engineers confirmed the MCP960x/MCP9601
  # series locks up and stops responding after receiving a full I2C bus scan
  # (github.com/adafruit/Adafruit_Wippersnapper_Arduino/issues/299) -- which
  # is exactly the intermittent-then-dead behavior seen here with scan: true.
  scan: false
  # MCP9600-family silicon has a documented errata, "Intermittent I2C Read
  # Command Clock Stretching Failure", that manifests above ~85kHz as stale
  # duplicate register data rather than a bus error (see
  # rikeshkkpatel.co.uk/diy-reflow-oven/problems-with-the-mcp9600-thermocouple-amplifier).
  # Staying at/below 85kHz keeps a safe margin under that threshold.
  frequency: 85kHz

sensor:
  - platform: bmp581_i2c
    address: 0x47
    update_interval: 30s
    temperature:
      id: bmp581_temperature
      name: "Temperature"
      oversampling: 8x
      iir_filter: 4x
    pressure:
      id: bmp581_pressure
      name: "Pressure"
      oversampling: 16x
      iir_filter: 4x

  - platform: mcp9600
    address: 0x67
    thermocouple_type: K
    update_interval: 30s
    hot_junction:
      id: thermocouple_temperature
      name: "Thermocouple Temperature"
    cold_junction:
      id: thermocouple_cold_junction
      name: "Thermocouple Cold Junction"

  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

  - platform: uptime
    name: "Uptime"

button:
  - platform: restart
    name: "Restart"

  # Woodstove event annotations -- each logs an immediate sensor snapshot
  # alongside a short event label, so temperature behavior can be correlated
  # with what was actually happening at the stove. Visible on the
  # http://flu-monitor.local dashboard; tap from a phone while standing there.
  - platform: template
    name: "Cold Start"
    on_press:
      - script.execute:
          id: log_to_sheets
          event: "cold_start"
  - platform: template
    name: "Opened Stove"
    on_press:
      - script.execute:
          id: log_to_sheets
          event: "opened_stove"
  - platform: template
    name: "Added Wood"
    on_press:
      - script.execute:
          id: log_to_sheets
          event: "added_wood"
  - platform: template
    name: "Damper Up"
    on_press:
      - script.execute:
          id: log_to_sheets
          event: "damper_up"
  - platform: template
    name: "Damper Down"
    on_press:
      - script.execute:
          id: log_to_sheets
          event: "damper_down"
  - platform: template
    name: "Burning Optimally"
    on_press:
      - script.execute:
          id: log_to_sheets
          event: "burning_optimally"
  - platform: template
    name: "Stove Roaring"
    on_press:
      - script.execute:
          id: log_to_sheets
          event: "roaring"
  - platform: template
    name: "Dying Down"
    on_press:
      - script.execute:
          id: log_to_sheets
          event: "dying_down"
  - platform: template
    name: "Fire Out"
    on_press:
      - script.execute:
          id: log_to_sheets
          event: "fire_out"
  - platform: template
    name: "Stove Off"
    on_press:
      - script.execute:
          id: log_to_sheets
          event: "stove_off"

# Logs sensor readings to a Google Sheet via a Google Apps Script webhook.
# See google-sheets-logger/README.md for how to set that webhook up; the two
# secrets below come from that setup.
http_request_async:
  id: sheets_http_client
  # Defaults (verify_ssl: true) already pull in ESPHome's common-CA bundle,
  # which covers Google's certificate -- no extra esp32 cert bundle config
  # needed for script.google.com.
  useragent: flu-monitor
  # The default 512B tx buffer isn't enough for Google's long deployment-ID
  # URL plus query string and headers; that showed up as an intermittent
  # "HTTP_CLIENT: Out of buffer" / esp_http_client_open ESP_FAIL.
  buffer_size_tx: 1024
  # Apps Script's redirect chain (exec -> googleusercontent echo -> back to
  # exec) occasionally loops before resolving -- observed taking as long as
  # ~40s in direct curl testing, entirely on Google's end (this is a known
  # Apps Script Web App latency characteristic, not device-specific). Since
  # requests now run off the main loop, a generous timeout costs nothing.
  timeout: 30s
  redirect_limit: 6

# Shared by both the periodic log (event left blank) and the event buttons
# below (event set to a short label) -- keeps the URL-building logic in one
# place instead of five copies.
script:
  - id: log_to_sheets
    parameters:
      event: string
    then:
      # GET, not POST: Apps Script Web Apps always redirect to a
      # script.googleusercontent.com URL that only accepts GET, and the
      # ESP32's HTTP client preserves the original method across that
      # redirect (unlike browsers/curl, which downgrade to GET). A POST
      # here fails with HTTP 405 even though it can look fine when tested
      # from a browser. See google-sheets-logger/README.md.
      - http_request_async.get:
          url: !lambda |-
            return (std::string) "${google_sheets_webhook_url}"
              + "?secret=${google_sheets_secret}"
              + "&temperature=" + str_sprintf("%.1f", id(bmp581_temperature).state)
              + "&pressure=" + str_sprintf("%.0f", id(bmp581_pressure).state)
              + "&thermocouple=" + str_sprintf("%.1f", id(thermocouple_temperature).state)
              + "&cold_junction=" + str_sprintf("%.1f", id(thermocouple_cold_junction).state)
              + "&event=" + event;
          on_error:
            then:
              - logger.log:
                  format: "Google Sheets post failed (cosmetic -- the row usually still lands; see google-sheets-logger/README.md)"
                  level: WARN

interval:
  # Checks every 30s, but only actually logs when the thermocouple has moved
  # past the deadband since the last point logged, or the heartbeat interval
  # has elapsed -- whichever comes first. Button-press events bypass this
  # entirely (they call log_to_sheets directly) since those are deliberate
  # annotations, not routine samples.
  - interval: 30s
    then:
      - if:
          condition:
            # Also records *why* into log_reason as a side effect, so the
            # Event column can distinguish a real temperature-driven log
            # from a routine keep-alive one. temp_change wins if both are
            # true at once.
            lambda: |-
              float current = id(thermocouple_temperature).state;
              // Sanity clamp: the MCP9600 (see CLAUDE.md's I2C gotchas)
              // occasionally returns a garbage reading -- observed 709C and
              // 891C from a probe sitting at room temperature -- even after
              // the scan:false/85kHz mitigations. A stovepipe surface has
              // no business reading outside roughly this range, so treat
              // anything past it as a glitch: skip the tick entirely rather
              // than logging it (or letting it poison last_logged_thermocouple_c,
              // which would otherwise make every subsequent *real* reading
              // look like a huge jump and cascade into a burst of bogus logs).
              if (current < -40.0f || current > 600.0f) {
                ESP_LOGW("main", "Ignoring implausible thermocouple reading: %.1f C", current);
                return false;
              }
              float delta = fabsf(current - id(last_logged_thermocouple_c));
              uint32_t elapsed_ms = millis() - id(last_log_millis);
              bool delta_due = delta >= ${thermocouple_deadband_c};
              bool heartbeat_due = elapsed_ms >= (${log_heartbeat_min} * 60000UL);
              if (delta_due) {
                id(log_reason) = "temp_change";
              } else if (heartbeat_due) {
                id(log_reason) = "heartbeat";
              }
              return delta_due || heartbeat_due;
          then:
            - lambda: |-
                id(last_logged_thermocouple_c) = id(thermocouple_temperature).state;
                id(last_log_millis) = millis();
            - script.execute:
                id: log_to_sheets
                event: !lambda 'return id(log_reason);'

