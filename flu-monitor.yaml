# Adafruit ESP32 Feather V2 (8MB flash, 2MB PSRAM) + Adafruit BMP581 and
# Adafruit MCP9601 (MCP96L01) thermocouple amplifier, both over STEMMA QT.
#
# Board notes:
#   - STEMMA QT I2C bus: SDA = GPIO22, SCL = GPIO20
#   - GPIO2 gates power to the STEMMA QT connector (and NeoPixel); it must be
#     driven HIGH or the sensors are unpowered and won't show up on the bus.
#   - Red onboard LED = GPIO13
#   - Adafruit BMP581 breakout defaults to I2C address 0x47 (0x46 with the SDO jumper cut).
#   - Adafruit MCP9601 breakout defaults to I2C address 0x67, and uses
#     ESPHome's stock 'mcp9600' component (it supports both MCP9600 and
#     MCP9601 device IDs). No patched/local component needed.

esphome:
  name: flu-monitor
  friendly_name: Flu Monitor

esp32:
  board: adafruit_feather_esp32_v2
  flash_size: 8MB
  framework:
    type: esp-idf

psram:
  mode: quad
  speed: 80MHz

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    encryption:
      key: !secret api_encryption_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Flu Monitor Fallback"
    password: !secret ap_password

captive_portal:

# Browser dashboard at http://flu-monitor.local showing live sensor state.
# ota disabled here: the 'ota' section above already provides encrypted
# updates, and web_server's own /update endpoint would be unauthenticated.
web_server:
  version: 2
  ota: false

status_led:
  pin: GPIO13

# Power for the STEMMA QT port. Kept on permanently and hidden from Home Assistant.
switch:
  - platform: gpio
    pin:
      number: GPIO2
      ignore_strapping_warning: true
    id: stemma_qt_power
    name: "STEMMA QT Power"
    restore_mode: ALWAYS_ON
    internal: true
    setup_priority: 1200  # POWER: must be on before the i2c bus (1000) initializes

i2c:
  sda: GPIO22
  scl: GPIO20
  # Bus scan disabled: Adafruit's own engineers confirmed the MCP960x/MCP9601
  # series locks up and stops responding after receiving a full I2C bus scan
  # (github.com/adafruit/Adafruit_Wippersnapper_Arduino/issues/299) -- which
  # is exactly the intermittent-then-dead behavior seen here with scan: true.
  scan: false
  # MCP9600-family silicon has a documented errata, "Intermittent I2C Read
  # Command Clock Stretching Failure", that manifests above ~85kHz as stale
  # duplicate register data rather than a bus error (see
  # rikeshkkpatel.co.uk/diy-reflow-oven/problems-with-the-mcp9600-thermocouple-amplifier).
  # Staying at/below 85kHz keeps a safe margin under that threshold.
  frequency: 85kHz

sensor:
  - platform: bmp581_i2c
    address: 0x47
    update_interval: 30s
    temperature:
      name: "Temperature"
      oversampling: 8x
      iir_filter: 4x
    pressure:
      name: "Pressure"
      oversampling: 16x
      iir_filter: 4x

  - platform: mcp9600
    address: 0x67
    thermocouple_type: K
    update_interval: 30s
    hot_junction:
      name: "Thermocouple Temperature"
    cold_junction:
      name: "Thermocouple Cold Junction"

  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

  - platform: uptime
    name: "Uptime"

button:
  - platform: restart
    name: "Restart"
