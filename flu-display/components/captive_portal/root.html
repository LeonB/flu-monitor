<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      body { font-family: sans-serif; background: #fff; max-width: 360px; margin: 40px auto; padding: 0 16px; }
      h1 { font-size: 1.2em; }
      label { display: block; margin-top: 12px; font-size: 0.9em; color: #333; }
      input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; font-size: 1em; }
      button { margin-top: 20px; width: 100%; padding: 10px; font-size: 1em; }
    </style>
    <title>Flu Display Setup</title>
  </head>
  <body>
    <h1>Flu Display WiFi Setup</h1>
    <p>Enter your WiFi network's name and password. The device will restart and try to join it.</p>
    <form method="POST" action="/save">
      <label>Network name (SSID)
        <input type="text" name="ssid" maxlength="32" required autocapitalize="off" autocorrect="off">
      </label>
      <label>Password
        <input type="password" name="password" maxlength="64">
      </label>
      <button type="submit">Save &amp; Connect</button>
    </form>
  </body>
</html>
