<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Sign in · Flu Monitor</title>
<style>
  :root { color-scheme: light; --ink:#292824; --muted:#77756e; --paper:#f7f4ed; --card:#fffdf8; --accent:#bd5b24; --line:#e7e1d5; --error:#a94236; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; min-height:100dvh; display:grid; place-items:center; padding:24px; background:var(--paper); color:var(--ink); font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  main { width:min(100%,390px); }
  .brand { display:flex; align-items:center; gap:12px; margin:0 0 28px 4px; font-size:17px; font-weight:700; letter-spacing:-.02em; }
  .mark { width:42px; height:42px; display:grid; place-items:center; border-radius:15px; background:#f3e7d3; color:var(--accent); }
  .mark svg { width:25px; height:25px; }
  .card { padding:30px 26px 24px; border:1px solid var(--line); border-radius:28px; background:var(--card); box-shadow:0 16px 44px #403b2a12; }
  .eyebrow { margin:0 0 8px; color:var(--accent); font-size:11px; font-weight:750; letter-spacing:.12em; text-transform:uppercase; }
  h1 { margin:0; font-family:Georgia,serif; font-size:32px; font-weight:500; letter-spacing:-.04em; }
  .intro { margin:9px 0 25px; color:var(--muted); font-size:14px; line-height:1.55; }
  label { display:block; margin:0 0 8px 2px; font-size:13px; font-weight:650; }
  input { width:100%; height:50px; padding:0 15px; border:1px solid #d9d2c5; border-radius:15px; outline:none; background:#fff; color:var(--ink); font:inherit; font-size:15px; }
  input:focus { border-color:var(--accent); box-shadow:0 0 0 3px #bd5b2420; }
  .error { min-height:20px; margin:8px 2px 2px; color:var(--error); font-size:12px; }
  .notice { min-height:20px; margin:8px 2px 2px; color:#427656; font-size:12px; }
  button { width:100%; height:50px; margin-top:15px; border:0; border-radius:999px; background:var(--ink); color:#fffdf8; font:inherit; font-size:15px; font-weight:700; cursor:pointer; }
  button:active { transform:translateY(1px); }
  .note { margin:18px 2px 0; color:var(--muted); font-size:11px; line-height:1.5; text-align:center; }
  .preview { margin:16px 0 0; padding:10px 12px; border:1px dashed #d8c9ac; border-radius:14px; color:#71614a; font-size:11px; line-height:1.45; text-align:center; }
  @media (max-width:420px) { body { padding:20px; } .card { padding:26px 22px 22px; } }
</style>
</head>
<body>
<main>
  <div class="brand"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-3.6 7-10V5l-7-2-7 2v6c0 6.4 7 10 7 10Z"/><path d="M12 7v7m0 0c-2.2 0-3.5-1.2-3.5-3m3.5 3c2.2 0 3.5-1.2 3.5-3"/></svg></span><span>Flu Monitor</span></div>
  <section class="card" aria-labelledby="title">
    <p class="eyebrow">Remote access</p>
    <h1 id="title">Welcome back</h1>
    <p class="intro">Sign in to check your stove and open the monitor dashboard.</p>
    <form method="post" action="/auth/login">
      <label for="password">Access password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <div class="error" role="alert">{{ERROR}}</div>
      <div class="notice" role="status">{{NOTICE}}</div>
      <button type="submit">Continue</button>
    </form>
    <p class="note">Your session stays active for 30 minutes in this preview.</p>
  </section>
  <p class="preview">Local preview · change the password under Settings → Dashboard access.</p>
</main>
</body>
</html>
